<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maple Rival</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="landing-page">
    <div class="glow glow-one"></div><div class="glow glow-two"></div>
    <main class="landing-shell">
      <a class="brand landing-brand" href="/" aria-label="Maple Rival 홈"><span class="brand-mark">MR</span><span>MAPLE RIVAL</span></a>
      <section class="search-hero">
        <p class="eyebrow">RIVALRY / EXP MONITOR</p>
        <h1>내 캐릭터 이름을<br /><span>입력하세요.</span></h1>
        <form id="characterSearch" class="search-form">
          <label class="sr-only" for="characterName">캐릭터 닉네임</label>
          <input id="characterName" name="name" maxlength="12" autocomplete="off" placeholder="캐릭터 닉네임" required />
          <button type="submit" aria-label="캐릭터 검색">→</button>
        </form>
        <p id="searchMessage" class="message" role="status">캐릭터를 찾으면 최근 15일의 성장 기록을 준비합니다.</p>
      </section>
      <footer>Data based on NEXON Open API</footer>
    </main>
    <script src="/static/landing.js" defer></script>
  </body>
</html>
